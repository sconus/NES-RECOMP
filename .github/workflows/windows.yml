# The Windows test bench (PLAN-windows.md): on every push, a GitHub
# Windows machine builds NES RECOMP's Windows parts with Zig and checks
# them. Step 1: the recompiler, which must write the same C as on the Mac
# (tests/check_same_c.py), then the breaks (tests/windows_breaks.py),
# each in a scratch copy on that machine. Step 2: the runtime, with SDL's
# official Windows build and zlib: nestest as `make test` checks it
# (tests/run_nestest.py) and the test ROM suite (tests/run_tests.py).
name: Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"           # the checks read the app's UTF-8 (its menu's "...")
    steps:
      - name: Files as they are in git (no "\r\n" added on checkout)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: The free test ROMs, at the same commit as on the Mac
        shell: bash
        run: |
          git init -q tests/roms/nes-test-roms
          cd tests/roms/nes-test-roms
          git remote add origin https://github.com/christopherpow/nes-test-roms.git
          git fetch -q --depth 1 origin 95d8f621ae55cee0d09b91519a8989ae0e64753b
          git checkout -q FETCH_HEAD

      - name: Zig 0.17.1 for Windows (checked against its published SHA-256)
        shell: pwsh
        run: |
          Invoke-WebRequest https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip -OutFile zig.zip
          $want = "B03F477A1943673E02ACA0F570E8030DFFD536CE1F45CBC4D3326EC31159562E"
          if ((Get-FileHash zig.zip -Algorithm SHA256).Hash -ne $want) { throw "Zig's checksum is wrong" }
          Expand-Archive zig.zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\zig-x86_64-windows-0.17.1" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "NESRECOMP_ZIG=$env:RUNNER_TEMP\zig-x86_64-windows-0.17.1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: SDL 2.32.10's official Windows build, and zlib 1.3.1's source (both checked)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.zip -OutFile sdl2.zip
          if ((Get-FileHash sdl2.zip -Algorithm SHA256).Hash -ne "F15CFF5FCA62EC9381A016EF1D42A95C638CD72D2F226BA5781C76FE43DBD1AC") { throw "SDL2's checksum is wrong" }
          Expand-Archive sdl2.zip -DestinationPath $env:RUNNER_TEMP
          # zlib's own release on GitHub (the same file as zlib.net's, which
          # began handing these machines something else), then zlib.net's.
          $zsum = "9A93B2B7DFDAC77CEBA5A558A580E74667DD6FEDE4585B91EEFB60F03B72DF23"
          foreach ($url in "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz",
                           "https://zlib.net/fossils/zlib-1.3.1.tar.gz") {
            try { Invoke-WebRequest $url -OutFile zlib.tar.gz } catch { "zlib from $url failed: $_" }
            if ((Test-Path zlib.tar.gz) -and (Get-FileHash zlib.tar.gz -Algorithm SHA256).Hash -eq $zsum) { break }
            "zlib from $url : not the right file ($((Get-Item zlib.tar.gz -ErrorAction SilentlyContinue).Length) bytes)"
          }
          if ((Get-FileHash zlib.tar.gz -Algorithm SHA256).Hash -ne $zsum) { throw "zlib's checksum is wrong" }
          tar -xzf zlib.tar.gz -C $env:RUNNER_TEMP
          $sdl = "$env:RUNNER_TEMP\SDL2-2.32.10\x86_64-w64-mingw32"
          "NESRECOMP_SDL2=$sdl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "NESRECOMP_ZLIB_SRC=$env:RUNNER_TEMP\zlib-1.3.1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdl\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: The recompiler, built for Windows
        shell: bash
        run: |
          mkdir -p build/windows
          zig version
          zig cc -target x86_64-windows-gnu -O2 -Wall -Wextra -Werror -o build/windows/nesrecomp-recomp.exe recomp/*.c app/windows/utf8.rc

      - name: The same C as on the Mac
        run: python tests/check_same_c.py --recompiler build/windows/nesrecomp-recomp.exe

      - name: The runtime's system parts on Windows (pictures' folders, Ctrl+Break)
        run: python tests/check_runtime_sys.py

      - name: The runtime on Windows - nestest, as make test checks it
        run: python tests/run_nestest.py

      - name: The runtime on Windows - the test ROM suite (tests/suite.txt)
        run: python tests/run_tests.py

      - name: Save states, rewind and fast-forward on Windows (tests/check_states.py)
        run: python tests/check_states.py

      - name: The pause menu on Windows - pictures, save, load, reset, sound, window, controllers (tests/check_menu.py)
        run: python tests/check_menu.py

      - name: The title picture on Windows - a Start press, 10 seconds, none for music (tests/check_titles.py)
        run: python tests/check_titles.py

      - name: Pictures of the Controllers pages as Windows draws them (tests/menu_pictures.py)
        run: python tests/menu_pictures.py build/menu-pictures

      - name: Those pictures, as a download (this run's page, Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: controllers-pages-windows
          path: build/menu-pictures/*.png

      - name: Recording on Windows (Media Foundation), read back
        run: python tests/check_record_win.py

      - name: The app on Windows, put together with its own Zig (tools/make_windows_app.py)
        run: python tools/make_windows_app.py --cc "zig cc" --sdl2 "$env:NESRECOMP_SDL2" --zlib-src "$env:NESRECOMP_ZLIB_SRC" --recomp build/windows/nesrecomp-recomp.exe --out build/windows/app --zig "$env:NESRECOMP_ZIG"

      - name: The app on Windows (tests/check_app.py)
        run: python tests/check_app.py

      - name: Pictures of the shelf as Windows draws it (tests/shelf_pictures.py)
        run: python tests/shelf_pictures.py build/shelf-pictures

      - name: Those pictures, as a download (this run's page, Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: shelf-windows
          path: build/shelf-pictures/*.png

      - name: The Windows release, made (tools/make_windows_release.py)
        run: python tools/make_windows_release.py --app build/windows/app --zig "$env:NESRECOMP_ZIG" --sdl2-license "$env:NESRECOMP_SDL2\..\LICENSE.txt" --zlib-src "$env:NESRECOMP_ZLIB_SRC"

      - name: The Windows release, unzipped and used (tests/check_release_windows.py)
        run: python tests/check_release_windows.py

      - name: Breaks, each in a scratch copy on this machine
        run: python tests/windows_breaks.py
